<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            border: 1px solid black;
            height: 500px;
            width: 800px;
            background-color: gray;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
        }
        .box1{
            border: 1px solid black;
            height: 400px;
            width: 700px;
            background-color: skyblue;
        }
        .box2{
            border: 20px solid firebrick;
            height: 300px;
            width: 600px;
            margin: 50px 50px 50px 50px;
            padding: 30px 30px 30px 30px;
            background-color: blue;
            text-align: center;
        }
        .box3{
            border: 1px solid black;
            height: 200px;
            width: 500px;
            /* margin: 10px; */
            background-color: powderblue;
            text-align: center;
            line-height: 195px;
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .margin{
            position: absolute;
            top: 155px;
            left: 650px;
        }
        .padding{
            position: absolute;
            top: 215px;
            left: 650px;
            color: white;
        }
        .border{
            position: absolute;
            top: 190px;
            left: 650px;
            color: white;
        }
    </style>
</head>
<body>
    <h1 align="center">Box Plotting</h1>
    <div class="con">
        <div class="box">
            <div class="box1">
                <p class="margin">Margin</p>
                <div class="box2">
                    <p class="border">Border</p>
                    <p class="padding">Padding</p>         
                    <div class="box3">
                        <p>Content</p>
                    </div>    
                </div>
            </div>
        </div>
    </div>
</body>
</html>
